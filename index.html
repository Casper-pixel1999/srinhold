<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#203d32">
  <title>Янтарная крепость</title>
  <link rel="icon" href="assets/runtime/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="crest" aria-hidden="true">Я</span><div><h1>Янтарная крепость</h1><small>Начало поселения</small></div></div>
    <dl class="resources" aria-label="Запасы поселения">
      <div><dt>Дерево</dt><dd id="wood">150</dd></div>
      <div><dt>Камень</dt><dd id="stone">100</dd></div>
      <div><dt>Еда</dt><dd id="food">100</dd></div>
      <div><dt>Золото</dt><dd id="gold">100</dd></div>
      <div class="population"><dt>Жители</dt><dd><span id="residents">12</span>/<span id="capacity">20</span></dd></div>
    </dl>
    <button id="pause" aria-pressed="false">Пауза</button>
  </header>
  <main id="world">
    <canvas id="map" tabindex="0" aria-label="Карта поселения. Перетаскивайте для перемещения, выбирайте клетки для строительства."></canvas>
    <div class="region"><span>Долина Янтаря</span><small>Свободное строительство</small></div>
    <nav class="save-tools" aria-label="Сохранение поселения"><button id="save">Сохранить</button><button id="load">Загрузить</button></nav>
    <div id="battle-result" role="status" hidden></div><div id="paused" hidden>Пауза</div>
    <div id="loading" role="status">Загружаем долину…</div>
    <nav class="camera-tools" aria-label="Управление картой">
      <button id="zoom-in" aria-label="Приблизить">+</button>
      <button id="zoom-out" aria-label="Отдалить">−</button>
      <button id="reset" aria-label="Вернуться к крепости">⌂</button>
    </nav>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <nav class="defense-tools" aria-label="Оборона"><button id="build-wall" data-building="wall">Стена</button><button id="build-gate" data-building="gate">Ворота</button><button id="build-tower" data-building="tower">Башня</button><button id="build-guard" data-building="guard">Страж</button><button id="siege">Начать осаду</button><button id="restart" hidden>Заново</button></nav>
  <footer class="dock">
    <div class="build-options" role="group" aria-label="Постройки">
      <button id="build-house" class="build-card" data-building="house" aria-pressed="false"><img src="assets/runtime/house.webp" alt=""><span><strong>Дом</strong><small>35 дерева · 15 золота</small></span></button>
      <button id="build-farm" class="build-card" data-building="farm" aria-pressed="false"><img src="assets/runtime/farm.webp" alt=""><span><strong>Ферма</strong><small>45 дерева · 20 золота</small></span></button>
      <button id="build-lumber" class="build-card" data-building="lumber" aria-pressed="false"><img src="assets/runtime/lumber.webp" alt=""><span><strong>Лесоруб</strong><small>25 дерева · 25 золота</small></span></button>
    </div>
    <div class="context"><strong id="settlement-status">Поселение растёт</strong><span id="selection">Ваше поселение</span><span id="hint">Выберите постройку и место</span><span id="siege-status" role="status" aria-live="polite">Подготовка: укрепите восточный подход</span><button id="gate-toggle" hidden>Открыть ворота</button><span id="clock">Время: 00:00</span></div>
    <div id="confirmation" hidden><span id="placement">Выберите свободную клетку</span><div><button id="confirm" class="primary" disabled>Построить</button><button id="cancel">Отмена</button></div></div>
  </footer>
  <script type="module" src="src/main.js"></script>
</body>
</html>
